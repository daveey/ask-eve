name = "ask-eve-inbox"
main = "src/index.mjs"
compatibility_date = "2026-04-01"
workers_dev = false

# Route /admin* (Cloudflare-Access-protected), /ingest* (first-party PostHog-compatible ingest),
# and /api/metrics* (public aggregated metrics API) on askevepodcast.com
routes = [
  { pattern = "askevepodcast.com/admin*", zone_name = "askevepodcast.com" },
  { pattern = "askevepodcast.com/ingest*", zone_name = "askevepodcast.com" },
  { pattern = "askevepodcast.com/api/metrics*", zone_name = "askevepodcast.com" }
]

# Cron trigger: poll public @askevepodcast mentions every 15 minutes and queue leak-checked drafts
[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "ask-eve-meta"
database_id = "__D1_DATABASE_ID__"

[[r2_buckets]]
binding = "RAW_BUCKET"
bucket_name = "ask-eve-masters"

[[send_email]]
name = "SEND_EMAIL"

[vars]
ADMIN_EMAIL = "david@dbloom.in"
GROK_MODEL = "grok-4.7"
X_ACCOUNT_HANDLE = "askevepodcast"
X_OAUTH_REDIRECT_URI = "https://askevepodcast.com/admin/x/oauth/callback"
# Optional upstream PostHog target for dual-forwarding:
#   - Self-hosted Docker stack (infra/posthog/docker-compose.yml): "https://ph.askevepodcast.com"
#   - PostHog Cloud free tier fallback: "https://us.i.posthog.com"
POSTHOG_UPSTREAM_HOST = "https://ph.askevepodcast.com"
POSTHOG_PROJECT_API_KEY = "phc_askeve_selfhosted_public"
