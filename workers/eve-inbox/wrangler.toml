# workers/eve-inbox/wrangler.toml — Cloudflare Worker for Ask Eve inbound email + @askevepodcast X mention queue,
# Grok-4.7 document triage + leak-checked draft replies, and Cloudflare-Access-protected /admin/ console.
#
# Deployed by Hermes in task D-016 (see docs/deploy-guide.md).
# Secrets (set via `npx wrangler@4 secret put <NAME> --config workers/eve-inbox/wrangler.toml`, NEVER committed):
#   - XAI_API_KEY            : xAI API key for grok-4.7 triage + draft reply generation
#   - ADMIN_EMAIL            : David's Google login email (from Hermes's private config)
#   - CF_ACCESS_TEAM_DOMAIN  : Cloudflare Zero Trust team domain (e.g. <team>.cloudflareaccess.com)
#   - CF_ACCESS_AUD          : Cloudflare Access Application Audience (AUD) tag for askevepodcast.com/admin*
#   - PRIVATE_LEAK_TERMS     : Comma-separated private blocklist terms (personal emails, addresses, etc.)
#   - X_CLIENT_ID / X_CLIENT_SECRET : X OAuth 2.0 PKCE app credentials for @askevepodcast (/admin/x/oauth/start)
#   - OR X_API_KEY / X_API_SECRET / X_ACCESS_TOKEN / X_ACCESS_TOKEN_SECRET : OAuth 1.0a credentials for @askevepodcast

name = "ask-eve-inbox"
main = "src/index.mjs"
compatibility_date = "2026-10-01"
workers_dev = false

routes = [
  { pattern = "askevepodcast.com/admin*", zone_name = "askevepodcast.com" }
]

[triggers]
crons = ["*/10 * * * *"]

[vars]
MASTERS_BUCKET = "ask-eve-masters"
REPLY_FROM = "eve@askevepodcast.com"
REPLY_FROM_NAME = "Eve — Ask Eve Podcast"
XAI_MODEL = "grok-4.7"

[[r2_buckets]]
binding = "MASTERS"
bucket_name = "ask-eve-masters"

[[d1_databases]]
binding = "DB"
database_name = "ask-eve-meta"
database_id = "__D1_DATABASE_ID__"
migrations_dir = "../../migrations"

[[send_email]]
name = "SEND_EMAIL"
