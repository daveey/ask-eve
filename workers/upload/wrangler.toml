# Ask Eve upload Worker. Deploy: see docs/deploy-guide.md §4.
name = "ask-eve-upload"
main = "src/index.mjs"
compatibility_date = "2026-10-01"
workers_dev = false

# Custom domain (the zone askevepodcast.com is on Cloudflare); wrangler creates the DNS record + certificate.
routes = [{ pattern = "upload.askevepodcast.com", custom_domain = true }]

[vars]
# CF_ACCOUNT_ID is a Worker secret, not a var (kept out of git): printf %s "$CF_ACCOUNT_ID" | npx wrangler@4 secret put CF_ACCOUNT_ID
MASTERS_BUCKET = "ask-eve-masters"
GH_REPO = "daveey/ask-eve"
GH_WORKFLOW = "ingest.yml"
GH_REF = "main"
NOTIFY_FROM = "eve@askevepodcast.com"   # sender for /notify; the zone has Email Routing enabled

[[r2_buckets]]
binding = "MASTERS"
bucket_name = "ask-eve-masters"

# D1 metadata DB. The Worker code does not use it yet; the block lets `wrangler d1 migrations apply` and
# publish.yml / meta.yml (`wrangler d1 execute --config workers/upload/wrangler.toml`) find the database.
# The id is kept out of git: the workflows substitute __D1_DATABASE_ID__ from the GitHub secret D1_DATABASE_ID at run time.
# Locally: sed -i "s/__D1_DATABASE_ID__/$D1_DATABASE_ID/" wrangler.toml (and don't commit the result).
[[d1_databases]]
binding = "DB"
database_name = "ask-eve-meta"
database_id = "__D1_DATABASE_ID__"   # ask-eve-meta; see above
migrations_dir = "../../migrations"

# /notify sends with this binding. Cloudflare only delivers send_email to addresses VERIFIED in this account's
# Email Routing, so the Worker can't mail anyone else. The recipient is the NOTIFY_TO secret (kept out of git).
[[send_email]]
name = "MAILER"

# Secrets (never in this file): npx wrangler@4 secret put CF_ACCOUNT_ID | UPLOAD_TOKEN | R2_ACCESS_KEY_ID | R2_SECRET_ACCESS_KEY | GITHUB_TOKEN | NOTIFY_TOKEN | NOTIFY_TO

[observability]
enabled = true
