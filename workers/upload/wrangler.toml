# Ask Eve upload Worker. Deploy: see docs/deploy-guide.md §4.
name = "ask-eve-upload"
main = "src/index.mjs"
compatibility_date = "2026-10-01"
workers_dev = false

# Custom domain (the zone askevepodcast.com is on Cloudflare); wrangler creates the DNS record + certificate.
routes = [{ pattern = "upload.askevepodcast.com", custom_domain = true }]

[vars]
CF_ACCOUNT_ID = "***REDACTED***"   # not a secret; `npx wrangler@4 whoami`
MASTERS_BUCKET = "ask-eve-masters"
GH_REPO = "daveey/ask-eve"
GH_WORKFLOW = "ingest.yml"
GH_REF = "main"
NOTIFY_FROM = "eve@askevepodcast.com"   # sender for /notify; the zone has Email Routing enabled

[[r2_buckets]]
binding = "MASTERS"
bucket_name = "ask-eve-masters"

# D1 metadata DB. The Worker code does not use it yet; the block lets `wrangler d1 migrations apply` and
# publish.yml (`wrangler d1 execute --config workers/upload/wrangler.toml`) find the database. IDs are not secrets.
[[d1_databases]]
binding = "DB"
database_name = "ask-eve-meta"
database_id = "***REDACTED***"   # ask-eve-meta
migrations_dir = "../../migrations"

# /notify sends with this binding. Cloudflare only delivers send_email to addresses VERIFIED in this account's
# Email Routing, so the Worker can't mail anyone else. The recipient is the NOTIFY_TO secret (kept out of git).
[[send_email]]
name = "MAILER"

# Secrets (never in this file): npx wrangler@4 secret put UPLOAD_TOKEN | R2_ACCESS_KEY_ID | R2_SECRET_ACCESS_KEY | GITHUB_TOKEN | NOTIFY_TOKEN | NOTIFY_TO

[observability]
enabled = true
